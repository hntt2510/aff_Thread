name: Scheduler Queue Runner

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scheduler Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${APP_URL:-https://affthread-chi.vercel.app}/api/internal/scheduler/run"
          echo "Triggering scheduler at $TARGET_URL..."
          if [ -n "$CRON_SECRET" ]; then
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$TARGET_URL" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json")
          else
            echo "Warning: CRON_SECRET is not set in repository secrets. Triggering without Bearer token."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$TARGET_URL" \
              -H "Content-Type: application/json")
          fi
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

name: Scheduler Queue Runner (Manual Backup)

on:
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secrets and Trigger Scheduler
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured in repository secrets. Failing workflow."
            exit 1
          fi

          TARGET_URL="${APP_URL:-https://affthread-chi.vercel.app}/api/internal/scheduler/run"
          echo "Triggering scheduler at $TARGET_URL..."

          # Curl with --fail so HTTP 4xx/5xx exits with non-zero code.
          # Secret is passed via Authorization Bearer without being echoed.
          curl --fail --show-error --silent \
            -X POST "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "X-Scheduler-Source: github-manual" \
            -H "Content-Type: application/json"


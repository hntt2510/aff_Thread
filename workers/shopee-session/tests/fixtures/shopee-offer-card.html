<!DOCTYPE html>
<html>
<head><title>Shopee Offer Card Fixture</title></head>
<body>
  <div class="user-profile-avatar" data-testid="user-avatar">
    <img alt="avatar" src="https://cf.shopee.vn/avatar.jpg" />
  </div>

  <div class="offer-product-item" data-testid="product-card">
    <h3 class="product-title" data-testid="product-title">Nồi Chiên Không Dầu Sunhouse 6L SHD4026</h3>
    <a class="product-link" data-testid="product-link" href="https://shopee.vn/noi-chien-sunhouse-i.12345.67890">View</a>
    <img class="product-image" data-testid="product-img" src="https://cf.shopee.vn/file/sunhouse.jpg" />
    <span class="category-tag" data-testid="category-name">Thiết Bị Gia Dụng</span>
    <span class="commission-rate" data-testid="commission-rate">12.5%</span>
    <span class="commission-amount" data-testid="commission-amount">45.000₫</span>
    <span class="sold-count" data-testid="sold-count">Đã bán 1.5k</span>
    <button class="get-link-btn" data-testid="get-link-btn">Lấy link</button>
  </div>

  <div class="offer-product-item" data-testid="product-card">
    <h3 class="product-title" data-testid="product-title">Chuột Không Dây Logitech M331 Silent Plus</h3>
    <a class="product-link" data-testid="product-link" href="https://shopee.vn/logitech-m331-i.5555.9999">View</a>
    <img class="product-image" data-testid="product-img" src="https://cf.shopee.vn/file/logitech.jpg" />
    <span class="category-tag" data-testid="category-name">Phụ Kiện Máy Tính</span>
    <span class="commission-rate" data-testid="commission-rate">8%</span>
    <span class="sold-count" data-testid="sold-count">Đã bán 12.3k</span>
    <button class="get-link-btn" data-testid="get-link-btn">Lấy link</button>
  </div>
</body>
</html>
